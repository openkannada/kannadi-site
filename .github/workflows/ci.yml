name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: kannadi
        run: echo "rev=$(tr -d '[:space:]' < kannadi.rev)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: openkannada/kannadi
          ref: ${{ steps.kannadi.outputs.rev }}
          path: .kannadi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .kannadi
      - id: wasm-bindgen
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' .kannadi/Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Every file has a license (REUSE)
        run: pipx run reuse==6.3.0 lint
      - run: npm ci
      - run: KANNADI_DIR=.kannadi scripts/build-wasm.sh
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run seo-smoke
      - run: npm run voice-lint
      - name: Every page at 6 widths, light and dark
        run: npm run layout-check
      - name: Typing in the editor, on desktop keys and composing phone keyboards
        run: npm run typing-check
      - name: Lighthouse, mobile
        run: npx lhci autorun
      - name: Build and check the drafts, which wait for a native reader or for approval
        run: |
          KANNADA_DRAFTS=1 npx astro build --outDir dist-drafts
          KANNADA_DRAFTS=1 node scripts/seo-smoke.ts dist-drafts
          KANNADA_DRAFTS=1 node scripts/voice-lint.ts dist-drafts
          node scripts/layout-check.ts dist-drafts
      - name: Build and check with a site URL
        run: |
          SITE_URL=https://example.org/kannada/ npx astro build --outDir dist-site
          node scripts/seo-smoke.ts dist-site https://example.org/kannada/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site
          path: |
            dist
            .lighthouseci
          include-hidden-files: true
          retention-days: 14

  # The editor in Chromium, Firefox and WebKit, on desktops and phones, light and dark: on today's core, on the
  # ProseMirror core that ?editor=next opens, and with the typing engine that ?typing=next turns on.
  editor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: [doc, next]
        typing: [list]
        include:
          - core: next
            typing: engine
    steps:
      - uses: actions/checkout@v7
      - id: kannadi
        run: echo "rev=$(tr -d '[:space:]' < kannadi.rev)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: openkannada/kannadi
          ref: ${{ steps.kannadi.outputs.rev }}
          path: .kannadi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .kannadi
      - id: wasm-bindgen
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' .kannadi/Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: KANNADI_DIR=.kannadi scripts/build-wasm.sh
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium firefox webkit
      - name: The editor on the ${{ matrix.core }} core, with suggestions from the ${{ matrix.typing }}
        run: npx playwright test
        env:
          EDITOR_NEXT: ${{ matrix.core == 'next' && '1' || '' }}
          TYPING_NEXT: ${{ matrix.typing == 'engine' && '1' || '' }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: editor-tests-${{ matrix.core }}-${{ matrix.typing }}
          path: |
            playwright-report
            test-results
          retention-days: 14
