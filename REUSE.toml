version = 1
SPDX-PackageName = "kannadi-site"
SPDX-PackageSupplier = "The Open Kannada Authors"
SPDX-PackageDownloadLocation = "https://github.com/openkannada/kannadi-site"

# Everything not listed below: code and configuration.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Open Kannada Authors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Words we write.
[[annotations]]
path = ["src/content/**", "src/i18n/**", "**/*.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The Open Kannada Authors"
SPDX-License-Identifier = "CC-BY-4.0"

# Images we make.
[[annotations]]
path = ["public/brand/**", "public/og/**", "public/press/**", "src/assets/**", "public/*.png", "public/*.svg", "scripts/og-mark.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The Open Kannada Authors"
SPDX-License-Identifier = "CC-BY-4.0"

# Derived from Kannada Wikipedia article text.
[[annotations]]
path = "data/words.tsv"
precedence = "override"
SPDX-FileCopyrightText = "Kannada Wikipedia contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Noto fonts, unmodified subsets.
[[annotations]]
path = "src/fonts/noto-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Neha Sans and Neha Serif, from the openkannada/neha-fonts release.
[[annotations]]
path = "src/fonts/neha-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = ["2022 The Noto Project Authors", "2026 The Open Kannada Authors"]
SPDX-License-Identifier = "OFL-1.1"

# Gari, from the openkannada/gari-font release.
[[annotations]]
path = "src/fonts/gari-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = ["2026 The Open Kannada Authors", "2011-2012 Aravinda VK", "2005-2010 Indian Institute of Science, Bangalore"]
SPDX-License-Identifier = "OFL-1.1"

# The license text for every font above, with each font's copyright line.
[[annotations]]
path = "public/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = ["2022 The Noto Project Authors", "2026 The Open Kannada Authors", "2011-2012 Aravinda VK", "2005-2010 Indian Institute of Science, Bangalore"]
SPDX-License-Identifier = "OFL-1.1"

# Photos of the founding members, not covered by the licenses above.
[[annotations]]
path = "src/assets/people/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Prasad Subrahmanya and Neha Prasad"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"

# Our family photo beside the dedication, also not covered by the licenses above.
[[annotations]]
path = "src/assets/family/**"
precedence = "override"
SPDX-FileCopyrightText = "2023 Prasad Subrahmanya"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"

[[annotations]]
path = "data/scorecard/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 The Open Kannada Authors"
SPDX-License-Identifier = "CC-BY-4.0"
