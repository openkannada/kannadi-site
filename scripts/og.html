<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Graph card</title>
<style>
@font-face { font-family: "Neha Sans"; font-weight: 100 900; src: url(../src/fonts/neha-sans-kannada-wght.woff2) format("woff2"); unicode-range: U+0C80-0CFF, U+200C-200D, U+25CC, U+0964-0965; }
@font-face { font-family: "Noto Sans"; font-weight: 100 900; src: url(../src/fonts/noto-sans-latin-wght-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  position: relative; display: grid; grid-template-rows: auto 1fr auto; padding: 60px 72px 64px;
  font-family: "Neha Sans", "Noto Sans", sans-serif; color: oklch(0.2 0.025 268);
  background:
    radial-gradient(520px 420px at 92% 6%, oklch(0.86 0.15 85 / 0.8), transparent 70%),
    radial-gradient(520px 460px at 0% 70%, oklch(0.7 0.14 277 / 0.55), transparent 70%),
    radial-gradient(420px 340px at 70% 110%, oklch(0.75 0.15 20 / 0.4), transparent 70%),
    oklch(0.972 0.006 262);
}
.brand { display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 600; }
.mark { width: 64px; height: 64px; filter: drop-shadow(0 10px 14px oklch(0.46 0.19 277 / 0.35)); }
h1 { align-self: end; margin: 0 0 32px; font-size: 72px; line-height: 1.08; font-weight: 650; letter-spacing: -0.02em; max-width: 1000px; }
.pane { display: flex; align-items: center; gap: 32px; padding: 26px 36px; border-radius: 999px; font-size: 44px;
  background: oklch(0.99 0.004 262 / 0.7); border: 1px solid oklch(0.25 0.03 268 / 0.1);
  box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.9), 0 24px 48px -20px oklch(0.2 0.04 268 / 0.35); }
.from { color: oklch(0.46 0.022 268); }
.arrow { flex: 1; height: 4px; border-radius: 2px; background: linear-gradient(90deg, oklch(0.46 0.022 268 / 0.3), oklch(0.46 0.19 277)); position: relative; }
.arrow::after { content: ""; position: absolute; right: -2px; top: -9px; width: 18px; height: 18px; border-top: 4px solid oklch(0.46 0.19 277); border-right: 4px solid oklch(0.46 0.19 277); transform: rotate(45deg); border-radius: 2px; }
.to { font-weight: 600; color: oklch(0.46 0.19 277); }
</style>
</head>
<body>
<div class="brand"><img class="mark" src="og-mark.svg" alt=""><span>Open Kannada</span></div>
<h1 id="title"></h1>
<div class="pane"><span class="from" id="from"></span><span class="arrow"></span><span class="to" id="to" lang="kn"></span></div>
<script>
const q = new URLSearchParams(location.search);
for (const id of ["title", "from", "to"]) document.getElementById(id).textContent = q.get(id);
</script>
</body>
</html>
