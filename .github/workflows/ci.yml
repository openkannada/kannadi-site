name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A deploy that has started finishes; a newer push queues behind it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: kannadi
        run: echo "rev=$(tr -d '[:space:]' < kannadi.rev)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: openkannada/kannadi
          ref: ${{ steps.kannadi.outputs.rev }}
          path: .kannadi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .kannadi
      - id: wasm-bindgen
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' .kannadi/Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Every file has a license (REUSE)
        run: pipx run reuse==6.3.0 lint
      - run: npm ci
      - run: KANNADI_DIR=.kannadi scripts/build-wasm.sh
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run seo-smoke
      - run: npm run voice-lint
      - name: Every page at 6 widths, light and dark
        run: npm run layout-check
      - name: Lighthouse, mobile
        run: npx lhci autorun
      - name: Build and check with a site URL
        run: |
          SITE_URL=https://example.org/kannada/ npx astro build --outDir dist-site
          node scripts/seo-smoke.ts dist-site https://example.org/kannada/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site
          path: |
            dist
            .lighthouseci
          include-hidden-files: true
          retention-days: 14

  # Every push to main that passes the checks above goes live at https://openkannada.org. Every action here is
  # pinned to a commit, since this job holds the Cloudflare token.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: kannadi
        run: echo "rev=$(tr -d '[:space:]' < kannadi.rev)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: openkannada/kannadi
          ref: ${{ steps.kannadi.outputs.rev }}
          path: .kannadi
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .kannadi
      - id: wasm-bindgen
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' .kannadi/Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: KANNADI_DIR=.kannadi scripts/build-wasm.sh
      - name: Build for https://openkannada.org
        run: SITE_URL=https://openkannada.org/ npm run build
      - name: Check the built pages at the real address
        run: node scripts/seo-smoke.ts dist https://openkannada.org/
      - name: Before launch nothing; after launch, check for placeholders and save the live sitemap
        run: node scripts/launch-steps.ts before https://openkannada.org/
      - name: Publish to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.164.0"
          command: deploy
      - name: Check the live site, retrying while new domains get their certificates
        run: node scripts/live-check.ts https://openkannada.org/ 10 30
      - name: After launch, send the changed pages to IndexNow
        run: node scripts/launch-steps.ts after https://openkannada.org/
